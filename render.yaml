services:
  - type: web
    name: grow-easy-360
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /product
        destination: /product.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
